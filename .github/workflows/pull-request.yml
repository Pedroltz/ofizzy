name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore Ofizzy.slnx
      - run: dotnet build Ofizzy.slnx --configuration Release --no-restore
      - run: dotnet test Ofizzy.slnx --configuration Release --no-build
        env:
          ConnectionStrings__Postgres: Host=localhost;Database=unused
          Jwt__SigningKey: ci-only-signing-key-with-at-least-32-bytes

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/frontend/ofizzy-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: src/frontend/ofizzy-web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: src/frontend/ofizzy-web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose -f infra/compose/local.yaml config --quiet
      - run: docker compose -f compose.yaml -f infra/compose/development.yaml config --quiet
      - run: docker compose -f compose.yaml -f infra/compose/production.yaml config --quiet
        env:
          BACKEND_IMAGE: ofizzy-backend:validation
          FRONTEND_IMAGE: ofizzy-frontend:validation
