version: 2
updates:
  - package-ecosystem: npm
    directory: /src/frontend/ofizzy-web
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      compatible:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: nuget
    directories:
      - /src/backend/Ofizzy.Api
      - /src/backend/Ofizzy.UnitTests
      - /src/backend/Ofizzy.IntegrationTests
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      compatible:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    groups:
      compatible:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(ci)"
