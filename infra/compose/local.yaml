name: ofizzy-local

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ofizzy
      POSTGRES_USER: ofizzy
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofizzy -d ofizzy"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
    name: ofizzy_postgres_data
