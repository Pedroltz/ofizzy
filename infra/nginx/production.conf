server { listen 80; server_name ${APP_DOMAIN}; return 301 https://$host$request_uri; }
server {
    listen 443 ssl http2;
    server_name ${APP_DOMAIN};
    ssl_certificate /etc/letsencrypt/live/${APP_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${APP_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 10m;
    location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /health/ { proxy_pass http://backend:8080; access_log off; }
    location / { proxy_pass http://frontend:8080; proxy_set_header Host $host; }
}
