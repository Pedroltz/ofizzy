<div class="app-layout">
  <aside class="desktop-sidebar">
    <a routerLink="/" class="sidebar-brand"><span class="brand-mark small">🔧</span><strong>Sport Pneus</strong></a>
    <nav><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="nav-item"><span>⌂</span><span>Início</span></a><a routerLink="/ordens" routerLinkActive="active" class="nav-item"><span>🔧</span><span>Ordens de serviço</span></a><a routerLink="/clientes" routerLinkActive="active" class="nav-item"><span>👥</span><span>Clientes</span></a><a routerLink="/veiculos" routerLinkActive="active" class="nav-item"><span>🚗</span><span>Veículos</span></a><a routerLink="/configuracoes" routerLinkActive="active" class="nav-item"><span>⚙</span><span>Configurações</span></a></nav>
    <button type="button" class="profile-button" (click)="logout()"><span class="avatar">{{ user()?.name?.charAt(0) }}</span><span><strong>{{ user()?.name }}</strong><small>Sair</small></span><span>↪</span></button>
  </aside>
  <header class="mobile-header"><button type="button" class="icon-button" (click)="mobileMenu.set(true)" aria-label="Abrir menu">☰</button><strong>Sport Pneus</strong><span class="avatar">{{ user()?.name?.charAt(0) }}</span></header>
  @if (mobileMenu()) { <div class="mobile-drawer"><div class="drawer-panel"><nav><a routerLink="/" class="nav-item" (click)="mobileMenu.set(false)">⌂ <span>Início</span></a><a routerLink="/ordens" class="nav-item" (click)="mobileMenu.set(false)">🔧 <span>Ordens de serviço</span></a><a routerLink="/clientes" class="nav-item" (click)="mobileMenu.set(false)">👥 <span>Clientes</span></a><a routerLink="/veiculos" class="nav-item" (click)="mobileMenu.set(false)">🚗 <span>Veículos</span></a><a routerLink="/configuracoes" class="nav-item" (click)="mobileMenu.set(false)">⚙ <span>Configurações</span></a></nav><button type="button" class="secondary-button" (click)="logout()">Sair</button></div></div> }
  <main class="app-content"><router-outlet /></main>
</div>
