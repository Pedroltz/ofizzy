<main class="auth-page login-layout">
  <section class="auth-intro">
    <span class="brand-mark">🔧</span>
    <p class="eyebrow">SPORT PNEUS</p>
    <h1>Sua oficina, sem complicação.</h1>
    <p>Ordens de serviço organizadas e rápidas, do jeito que o trabalho precisa.</p>
  </section>
  <section class="auth-card login-card surface-card">
    <form [formGroup]="form" (ngSubmit)="submit()" class="form-stack">
      <header><h2>Entrar</h2><p>Use os dados criados no primeiro acesso.</p></header>
      <label>E-mail<input formControlName="email" type="email" autocomplete="email" /></label>
      <label>Senha<input formControlName="password" type="password" autocomplete="current-password" /></label>
      @if (invalidCredentials()) { <p class="field-error">E-mail ou senha inválidos.</p> }
      <button type="submit" class="primary-button full-control" [disabled]="saving()">{{ saving() ? 'Entrando...' : 'Entrar →' }}</button>
    </form>
  </section>
</main>
